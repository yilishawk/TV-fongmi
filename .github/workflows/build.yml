name: Build FongMi APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'
      
      - name: Install Python 3.10 for Chaquopy
        run: |
          sudo apt-get update
          sudo apt-get install -y python3.10 python3.10-dev
          sudo ln -sf /usr/bin/python3.10 /usr/local/bin/python3
          python3 --version
      
      - name: Create local.properties
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          echo "storeFile=../keystore.jks" >> local.properties
          echo "keyAlias=defaultkey" >> local.properties
          echo "storePassword=android" >> local.properties
          echo "keyPassword=android" >> local.properties
      
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew
      
      - name: Build Debug APK (Leanback)
        run: ./gradlew assembleLeanbackDebug
        
      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: TV-Leanback-Debug
          path: app/build/outputs/apk/leanback/debug/*.apk
